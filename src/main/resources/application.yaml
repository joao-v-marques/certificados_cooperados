server:
  servlet:
    context-path: /certificados-cooperados

app:
  certificados:
    diretorio: ${CERTIFICADOS_DIR:./storage/certificados}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  application:
    name: certificados-cooperados

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/certificados_cooperados}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

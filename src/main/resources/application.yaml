spring:
  application:
    name: certificados-cooperados

  # Valores padrao apontam para o Postgres local (nativo ou container, tanto faz:
  # ambos expoem localhost:5432 com as mesmas credenciais).
  # Em outros ambientes, sobrescreva via variavel de ambiente - nao edite este arquivo.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/certificados_cooperados}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

  jpa:
    # O Flyway e o dono do schema. O Hibernate apenas valida que as entidades
    # batem com as tabelas, e falha o startup se divergirem.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

spring:
  application:
    name: certificados-cooperados

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/certificados_cooperados}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
